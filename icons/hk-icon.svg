<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 704" width="704" height="704" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="704" y2="704" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f9bff"/>
      <stop offset="0.22" stop-color="#4fc3ff"/>
      <stop offset="0.38" stop-color="#3fd6a8"/>
      <stop offset="0.5" stop-color="#1fbf6a"/>
      <stop offset="0.68" stop-color="#1c8f9a"/>
      <stop offset="0.82" stop-color="#3347d6"/>
      <stop offset="1" stop-color="#1f1fa8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="704" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="704" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="700" height="700" rx="165" ry="165" fill="url(#bg)"/>
  <rect x="2" y="2" width="700" height="700" rx="165" ry="165" fill="url(#sheen)"/>
  <rect x="3" y="3" width="698" height="698" rx="164" ry="164" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- Soft white glow behind letters -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M118 236V458M277 236V458M118 347H277"/>
    <path d="M437 236V458M587 236L452 352M492 345L590 458"/>
  </g>

  <!-- Letters -->
  <g fill="none" stroke="#000000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- H -->
    <path d="M118 236V458"/>
    <path d="M277 236V458"/>
    <path d="M118 347H277"/>
    <!-- K -->
    <path d="M437 236V458"/>
    <path d="M587 236L452 352"/>
    <path d="M492 345L590 458"/>
  </g>

  <!-- Colon dots -->
  <g fill="#0b3b2a" fill-opacity="0.75" filter="url(#soft)">
    <circle cx="355" cy="297" r="19"/>
    <circle cx="355" cy="413" r="19"/>
  </g>
