plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.android'
}

android {
	compileSdk 34
	
	useLibrary 'org.apache.http.legacy'
	
	defaultConfig {
		applicationId "com.hkode.h3nrican3.app"
		namespace "com.hkode.h3nrican3.app"
		minSdkVersion 21
		targetSdkVersion 36
		versionCode 2
		versionName "1.1"
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = '17'
	}
	
	signingConfigs {
		hkode {
			storeFile file("${rootProject.rootDir}/Hkode.jks")
			storePassword "Hkode1234h"
			keyAlias "hkode"
			keyPassword "Hkode1234h"
			v1SigningEnabled true
			v2SigningEnabled true
		}
	}

	buildTypes {
		release {
			signingConfig signingConfigs.hkode
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
		unsigned {
			initWith release
			signingConfig null
			matchingFallbacks = ['release']
		}
		debug {
			signingConfig signingConfigs.hkode
		}
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'androidx.core:core-ktx:1.13.1'
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'androidx.activity:activity-ktx:1.9.2'
	implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
	implementation 'androidx.lifecycle:lifecycle-process:2.8.6'
	implementation 'androidx.biometric:biometric:1.1.0'
}

afterEvaluate {
	tasks.matching { it.name == "packageRelease" || it.name == "assembleRelease" }.configureEach {
		doLast {
			def apkDir = file("${project.buildDir}/outputs/apk/release")
			def signedApk = file("${apkDir}/app-release.apk")
			if (signedApk.exists()) {
				project.copy {
					from signedApk
					into rootProject.rootDir
					rename { String name -> "Hkode.apk" }
				}
			}
		}
	}
	tasks.matching { it.name == "packageUnsigned" || it.name == "assembleUnsigned" }.configureEach {
		doLast {
			def apkDir = file("${project.buildDir}/outputs/apk/unsigned")
			def unsignedApk = file("${apkDir}/app-unsigned-unsigned.apk")
			if (!unsignedApk.exists()) {
				unsignedApk = file("${apkDir}/app-unsigned.apk")
			}
			if (unsignedApk.exists()) {
				project.copy {
					from unsignedApk
					into rootProject.rootDir
					rename { String name -> "Hkode_unsign.apk" }
				}
			}
		}
	}
	tasks.matching { it.name == "packageDebug" || it.name == "assembleDebug" }.configureEach {
		doLast {
			def apkDir = file("${project.buildDir}/outputs/apk/debug")
			def debugApk = file("${apkDir}/app-debug.apk")
			if (debugApk.exists()) {
				project.copy {
					from debugApk
					into rootProject.rootDir
					rename { String name -> "Hkode.apk" }
				}
			}
		}
	}
}
